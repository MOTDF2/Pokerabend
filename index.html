<body>
<header id="hdr"><div class="hrow">
 <button id="backBtn" class="hbtn" data-a="back" aria-label="Zurück">‹</button>
 <h1 id="title">Pokerrunde</h1>
 <button id="menuBtn" class="hbtn" data-a="hmenu" aria-label="Menü">⋯</button>
</div></header>
<main id="app"></main>
<footer id="ftr"><nav>
 <button class="tab" data-a="tab" data-t="groups"><span>♣</span>Gruppen</button>
 <button class="tab" data-a="tab" data-t="members"><span>👥</span>Mitglieder</button>
 <button class="tab" data-a="tab" data-t="data"><span>💾</span>Daten</button>
</nav></footer>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast hidden"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
'use strict';
const APP_VERSION = '1.1';
const BACKUP_DAYS = 14;
const COL = ['#2563eb','#dc2626','#16a34a','#d97706','#7c3aed','#0891b2','#db2777','#65a30d','#475569','#ea580c'];

/* ---------- Speicher (IndexedDB) ---------- */
const Storage = {
  _db: null,
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('pokerrunde', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this._db = r.result; res(this._db); };
      r.onerror = () => rej(r.error);
    });
  },
  async get(k) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const q = db.transaction('kv').objectStore('kv').get(k);
      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
    });
  },
  async set(k, v) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(v, k);
      tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
    });
  }
};

let D = { members: [], groups: [], sessions: [] };
let META = { lastBackup: null };
const save = () => Storage.set('data', D).catch(e => toast('Speichern fehlgeschlagen: ' + e));
const saveMeta = () => Storage.set('meta', META).catch(() => {});

/* ---------- Hilfsfunktionen ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const NF = new Intl.NumberFormat('de-CH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const chf = c => 'CHF ' + NF.format((c || 0) / 100);
const sgn = c => (c > 0 ? '+' : c < 0 ? '−' : '') + NF.format(Math.abs(c || 0) / 100);
const cls = c => c > 0 ? 'pos' : c < 0 ? 'neg' : '';
const parseAmt = s => {
  if (s == null) return null;
  s = String(s).trim().replace(/[’'\s]/g, '').replace(',', '.');
  if (s === '') return null;
  const x = Number(s);
  return isFinite(x) ? Math.round(x * 100) : NaN;
};
const amtIn = c => c == null ? '' : (c / 100).toFixed(2);
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const dtLocal = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fDate = t => new Date(t).toLocaleDateString('de-CH', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' });
const fTime = t => new Date(t).toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
const fDur = ms => { const m = Math.max(0, Math.round(ms / 60000)), h = Math.floor(m / 60); return h ? `${h} h ${pad(m % 60)} min` : `${m} min`; };
const pctS = r => (r < 0 ? '−' : '') + Math.abs(Math.round(r * 100)) + ' %';
const pct = (a, b) => b ? Math.round(a / b * 100) + ' %' : '–';
const byName = (a, b) => a.name.localeCompare(b.name, 'de');
const mName = id => (D.members.find(m => m.id === id) || { name: '?' }).name;
const isArch = id => !!(D.members.find(m => m.id === id) || {}).archived;
const G = id => D.groups.find(g => g.id === id);
const S = id => D.sessions.find(s => s.id === id);
const sortIds = ids => ids.slice().sort((a, b) => mName(a).localeCompare(mName(b), 'de'));

/* ---------- Berechnungen ---------- */
function sessStats(s) {
  const end = s.end || Date.now();
  const map = {};
  s.players.forEach(p => map[p.memberId] = { id: p.memberId, buys: [], buy: 0, rebuys: 0, allins: 0, allinWins: 0, end: p.end ?? null, left: p.left || null, joined: p.joined || null, net: null, hours: 0, ttr: null });
  s.events.slice().sort((a, b) => a.t - b.t).forEach(e => {
    const p = map[e.memberId]; if (!p) return;
    if (e.type === 'buyin') { p.buys.push(e.t); p.buy += e.amount; }
    else if (e.type === 'allin') { p.allins++; if (e.won) p.allinWins++; }
  });
  const arr = Object.values(map);
  arr.forEach(p => {
    p.rebuys = Math.max(0, p.buys.length - 1);
    if (p.end != null) p.net = p.end - p.buy;
    const pe = p.left && p.left > s.start && p.left < end ? p.left : end;
    let st = p.buys.length ? p.buys[0] : s.start;
    if (st < s.start || st > pe) st = s.start;
    p.hours = Math.max(0, (pe - st) / 3600000);
    if (p.buys.length > 1 && p.buys[1] - p.buys[0] >= 60000) p.ttr = p.buys[1] - p.buys[0];
  });
  const pot = arr.reduce((a, p) => a + p.buy, 0);
  const endSum = arr.reduce((a, p) => a + (p.end || 0), 0);
  return { players: arr, map, pot, endSum, diff: endSum - pot, dur: end - s.start };
}

function settleTx(players) {
  const cr = players.filter(p => p.net > 0).map(p => ({ id: p.id, v: p.net })).sort((a, b) => b.v - a.v);
  const db = players.filter(p => p.net < 0).map(p => ({ id: p.id, v: -p.net })).sort((a, b) => b.v - a.v);
  const tx = []; let i = 0, j = 0;
  while (i < db.length && j < cr.length) {
    const x = Math.min(db[i].v, cr[j].v);
    if (x > 0) tx.push({ from: db[i].id, to: cr[j].id, v: x });
    db[i].v -= x; cr[j].v -= x;
    if (db[i].v === 0) i++;
    if (cr[j].v === 0) j++;
  }
  return tx;
}

function best(arr, f, dir) {
  if (!arr.length) return [];
  const vals = arr.map(f), m = dir > 0 ? Math.max(...vals) : Math.min(...vals);
  return arr.filter((p, i) => vals[i] === m);
}
function titleRow(icon, name, winners, val) {
  if (!winners.length) return '';
  return `<div class="li"><span class="ico">${icon}</span><span class="grow"><b>${esc(name)}</b><div class="mu">${esc(winners.map(p => mName(p.id)).join(', '))}</div></span><span class="num">${val(winners[0])}</span></div>`;
}

function nightTitles(st) {
  const P = st.players.filter(p => p.net != null);
  const q = p => p.allinWins / p.allins;
  const ai2 = P.filter(p => p.allins >= 2);
  const lucky = best(ai2, q, 1), unlucky = best(ai2, q, -1);
  let h = '';
  h += titleRow('🦈', 'Haifisch', best(P.filter(p => p.net > 0), p => p.net, 1), p => sgn(p.net));
  h += titleRow('👑', 'Comeback-König', best(P.filter(p => p.net > 0 && p.rebuys > 0), p => p.net, 1), p => `${p.rebuys} Rebuy${p.rebuys > 1 ? 's' : ''}`);
  h += titleRow('🏧', 'Bankautomat', best(P.filter(p => p.rebuys > 0), p => p.rebuys, 1), p => `${p.rebuys} Rebuy${p.rebuys > 1 ? 's' : ''}`);
  h += titleRow('💥', 'Kamikaze', best(P.filter(p => p.allins > 0), p => p.allins, 1), p => `${p.allins} All-in${p.allins > 1 ? 's' : ''}`);
  h += titleRow('🍀', 'Glückspilz', lucky, p => pct(p.allinWins, p.allins));
  if (lucky.length && unlucky.length && q(unlucky[0]) < q(lucky[0])) h += titleRow('🌧️', 'Pechvogel', unlucky, p => pct(p.allinWins, p.allins));
  return h;
}

function groupStats(g) {
  const ss = D.sessions.filter(s => s.groupId === g.id && s.status === 'closed').sort((a, b) => a.start - b.start);
  const P = {}, beats = {}, cum = {}, series = [];
  const get = id => P[id] || (P[id] = { id, nights: 0, nets: [], total: 0, buy: 0, rebuys: 0, allins: 0, allinWins: 0, hours: 0, ttr: [], ko: 0, wins: 0 });
  let durSum = 0, plSum = 0, potSum = 0;
  ss.forEach(s => {
    const st = sessStats(s);
    durSum += st.dur; plSum += st.players.length; potSum += st.pot;
    st.players.forEach(p => {
      const q = get(p.id), net = p.net ?? 0;
      q.nights++; q.nets.push(net); q.total += net; q.buy += p.buy; q.rebuys += p.rebuys;
      q.allins += p.allins; q.allinWins += p.allinWins; q.hours += p.hours;
      if (p.ttr != null) q.ttr.push(p.ttr);
      if (net > 0) q.wins++;
      cum[p.id] = (cum[p.id] || 0) + net;
    });
    s.events.forEach(e => {
      if (e.type !== 'allin' || !e.opp || !st.map[e.opp]) return;
      const w = e.won ? e.memberId : e.opp, l = e.won ? e.opp : e.memberId;
      (beats[w] || (beats[w] = {}))[l] = ((beats[w] || {})[l] || 0) + 1;
      if (!e.won) get(e.opp).ko++;
    });
    series.push({ t: s.start, cum: { ...cum } });
  });
  const arr = Object.values(P);
  arr.forEach(q => {
    q.avg = q.total / q.nights;
    q.sd = q.nights > 1 ? Math.sqrt(q.nets.reduce((a, x) => a + (x - q.avg) ** 2, 0) / (q.nights - 1)) : null;
    q.max = Math.max(...q.nets); q.min = Math.min(...q.nets);
    let k = 0, sg = 0;
    for (let i = q.nets.length - 1; i >= 0; i--) {
      const sn = Math.sign(q.nets[i]);
      if (sn === 0) break;
      if (!sg) sg = sn;
      if (sn !== sg) break;
      k++;
    }
    q.streak = k ? { n: k, sg } : null;
    q.ttrAvg = q.ttr.length ? q.ttr.reduce((a, b) => a + b, 0) / q.ttr.length : null;
    q.perH = q.hours > 0 ? q.total / q.hours : null;
    q.roi = q.buy ? q.total / q.buy : null;
  });
  arr.sort((a, b) => b.total - a.total);
  return { ss, arr, beats, series, durAvg: ss.length ? durSum / ss.length : 0, plAvg: ss.length ? plSum / ss.length : 0, potAvg: ss.length ? potSum / ss.length : 0 };
}

/* ---------- Navigation ---------- */
let stack = [{ v: 'groups' }];
let M = {};
const cur = () => stack[stack.length - 1];
function go(v) { stack.push(v); render(); window.scrollTo(0, 0); }
function back() { if (stack.length > 1) { stack.pop(); render(); } }
function setTab(t) { stack = [{ v: t }]; render(); window.scrollTo(0, 0); }

function render() {
  const c = cur();
  let r;
  try { r = VIEWS[c.v](c); }
  catch (e) { console.error(e); r = { title: 'Fehler', html: `<div class="banner err">${esc(e.message)}</div>` }; }
  if (!r) { if (stack.length > 1) { stack.pop(); return render(); } r = { title: '', html: '' }; }
  $('title').textContent = r.title;
  $('backBtn').style.visibility = stack.length > 1 ? 'visible' : 'hidden';
  $('menuBtn').style.visibility = r.menu ? 'visible' : 'hidden';
  $('app').innerHTML = r.html;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === stack[0].v));
  measure();
}

function measure() {
  const r = document.documentElement.style;
  r.setProperty('--hh', $('hdr').offsetHeight + 'px');
  r.setProperty('--fh', $('ftr').offsetHeight + 'px');
}

/* ---------- Modal & Toast ---------- */
function modal(html) { $('sheet').innerHTML = html; $('modal').classList.remove('hidden'); $('sheet').scrollTop = 0; }
function closeModal() { $('modal').classList.add('hidden'); $('sheet').innerHTML = ''; }
let toastTimer = null;
function toast(msg, label, fn) {
  const t = $('toast');
  t.innerHTML = `<span>${esc(msg)}</span>` + (label ? `<button type="button">${esc(label)}</button>` : '');
  t.classList.remove('hidden');
  if (label) t.querySelector('button').onclick = () => { t.classList.add('hidden'); fn(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), label ? 6000 : 2500);
}
function askText(title, value, onSave, extra) {
  M.onText = onSave;
  modal(`<h2>${esc(title)}</h2><label>Name<input type="text" data-f="txt" value="${esc(value)}" autocomplete="off"></label>${extra || ''}
  <div class="mbtns"><button class="btn" data-a="modalClose">Abbrechen</button><button class="btn pri" data-a="textSave">Speichern</button></div>`);
  setTimeout(() => { const i = document.querySelector('[data-f=txt]'); if (i) i.focus(); }, 50);
}
function chipsHtml(ids, selected, action) {
  if (!ids.length) return '<div class="mu">Keine verfügbar.</div>';
  return `<div class="chips">${sortIds(ids).map(id => `<button class="chip ${selected.has(id) ? 'on' : ''}" data-a="${action}" data-id="${id}">${esc(mName(id))}</button>`).join('')}</div>`;
}

  settle(c) {

    st.players.slice().sort((a, b) => mName(a.id).localeCompare(mName(b.id), 'de')).forEach(p => {

  data() {

    let h = `<h3>Datensicherung</h3><div class="card">
      <div>Letzte Sicherung: <b>${META.lastBackup ? fDate(META.lastBackup) + ', ' + fTime(META.lastBackup) : 'noch nie'}</b></div>

function nightsHtml(g) {
  const ss = D.sessions.filter(s => s.groupId === g.id).sort((a, b) => (a.status === b.status ? b.start - a.start : a.status === 'open' ? -1 : 1));
  let h = `<button class="btn pri block big" data-a="newSession">+ Neuer Abend</button>`;
  if (!ss.length) return h + `<div class="empty">Noch keine Abende erfasst.</div>`;
  ss.forEach(s => {
    const st = sessStats(s);
    let info = `${s.players.length} Spieler · Pot ${chf(st.pot)}`;
    if (s.status === 'closed') {
      const w = best(st.players.filter(p => p.net > 0), p => p.net, 1);
      if (w.length) info += ` · 🦈 ${esc(w.map(p => mName(p.id)).join(', '))} ${sgn(w[0].net)}`;
    }
    h += `<div class="card tap" data-a="openSession" data-id="${s.id}"><div class="row"><div class="grow"><div class="ttl">${fDate(s.start)}</div><div class="mu">${info}</div></div>
      ${s.status === 'open' ? '<span class="badge live">läuft</span>' : (st.diff !== 0 ? '<span class="badge" style="color:var(--neg)">Differenz</span>' : '')}<span class="chev">›</span></div></div>`;
  });
  return h;
}

function groupMembersHtml(g) {
  let h = `<div class="card list">`;
  if (!g.memberIds.length) h += `<div class="li mu">Noch keine Mitglieder in dieser Gruppe.</div>`;
  sortIds(g.memberIds).forEach(id => {
    h += `<div class="li"><span class="grow"><b>${esc(mName(id))}</b>${isArch(id) ? ' <span class="badge">archiviert</span>' : ''}</span><button class="btn danger" data-a="gRemoveMember" data-m="${id}">Entfernen</button></div>`;
  });
  h += `</div>`;
  const others = D.members.filter(m => !m.archived && !g.memberIds.includes(m.id)).map(m => m.id);
  h += `<h3>Hinzufügen</h3>${others.length ? chipsHtml(others, new Set(), 'gAddMember') : '<div class="mu">Alle aktiven Mitglieder sind bereits in der Gruppe.</div>'}`;
  h += `<button class="btn block" data-a="gNewMember">+ Neues Mitglied anlegen und hinzufügen</button>`;
  h += `<div class="note">Entfernte Mitglieder bleiben in vergangenen Abenden und in der Statistik erhalten.</div>`;
  return h;
}

function groupSettingsHtml(g) {
  return `<div class="card"><label>Gruppenname<input type="text" data-f="gName" value="${esc(g.name)}"></label>
    <label>Standard-Buy-in (CHF)<input inputmode="decimal" data-f="gBuy" value="${amtIn(g.buyIn)}"></label>
    <button class="btn pri block" data-a="gSave">Speichern</button></div>
    <button class="btn block" data-a="exportCsv">Abende als CSV exportieren (Excel)</button>
    <button class="btn danger block" data-a="delGroup">Gruppe löschen</button>`;
}

function liveHtml(s) {
  const g = G(s.groupId), st = sessStats(s);
  const act = s.players.filter(p => !p.left), gone = s.players.filter(p => p.left);
  const paid = gone.reduce((a, p) => a + (p.end || 0), 0);
  let h = `<div class="sum"><div><div class="mu">Pot</div><b class="num">${NF.format(st.pot / 100)}</b></div><div><div class="mu">Am Tisch</div><b class="num">${NF.format((st.pot - paid) / 100)}</b></div><div><div class="mu">Dauer</div><b data-dur>${fDur(st.dur)}</b></div><div><div class="mu">Spieler</div><b>${act.length}${gone.length ? `<span class="mu"> +${gone.length}</span>` : ''}</b></div></div>`;
  act.forEach(pl => {
    const p = st.map[pl.memberId];
    h += `<div class="card"><div class="row"><div class="grow"><div class="ttl">${esc(mName(p.id))}${pl.joined ? ` <span class="badge">ab ${fTime(pl.joined)}</span>` : ''}</div>
      <div class="mu">${p.buys.length}× Buy-in · ${chf(p.buy)}${p.allins ? ` · All-in ${p.allinWins}/${p.allins}` : ''}</div></div>
      <button class="ibtn" data-a="pmenu" data-m="${p.id}" aria-label="Optionen">⋯</button></div>
      <div class="btns"><button class="btn pri" data-a="buy" data-m="${p.id}">+ ${p.buys.length ? 'Rebuy' : 'Buy-in'} ${NF.format(g.buyIn / 100)}</button>
      <button class="btn warn" data-a="allin" data-m="${p.id}">All-in</button></div></div>`;
  });
  h += `<button class="btn block" data-a="addPlayers">+ Spieler stösst dazu</button>`;
  if (gone.length) {
    h += `<h3>Gegangen</h3>`;
    gone.forEach(pl => {
      const p = st.map[pl.memberId];
      h += `<div class="card gone"><div class="row"><div class="grow"><div class="ttl">${esc(mName(p.id))} <span class="badge">${fTime(pl.left)}</span></div>
        <div class="mu">Buy-ins ${chf(p.buy)} · ausbezahlt ${chf(p.end)} · <b class="${cls(p.net)}">${sgn(p.net)}</b></div></div>
        <button class="ibtn" data-a="pmenu" data-m="${p.id}" aria-label="Optionen">⋯</button></div></div>`;
    });
  }
  h += `<button class="btn pri block big" data-a="endSession">Abend beenden: Endbeträge erfassen</button>`;
  h += logHtml(s, false);
  return h;
}

function logHtml(s, collapsed) {
  const ev = s.events.concat(
    s.players.filter(p => p.joined).map(p => ({ t: p.joined, type: 'join', memberId: p.memberId })),
    s.players.filter(p => p.left).map(p => ({ t: p.left, type: 'leave', memberId: p.memberId, amount: p.end }))
  ).sort((a, b) => b.t - a.t);
  if (!ev.length) return '';
  let h = `<div class="card list">`;
  ev.forEach(e => {
    if (e.type === 'join' || e.type === 'leave') {
      h += `<div class="li"><span class="mu num">${fTime(e.t)}</span><span class="grow"><b>${esc(mName(e.memberId))}</b> · ${e.type === 'join' ? 'stösst dazu' : 'geht, ausbezahlt ' + chf(e.amount)}</span></div>`;
      return;
    }
    const t = e.type === 'buyin' ? `Buy-in ${chf(e.amount)}` : `All-in ${e.won ? 'gewonnen' : 'verloren'}${e.opp ? ` gegen ${esc(mName(e.opp))}` : ''}`;
    h += `<div class="li"><span class="mu num">${fTime(e.t)}</span><span class="grow"><b>${esc(mName(e.memberId))}</b> · ${t}</span><button class="ibtn" data-a="delEvent" data-id="${e.id}" aria-label="Löschen">✕</button></div>`;
  });
  h += `</div>`;
  return collapsed ? `<details><summary>Verlauf (${ev.length} Einträge)</summary>${h}</details>` : `<h3>Verlauf</h3>${h}`;
}

function resultHtml(s) {
  const st = sessStats(s);
  const P = st.players.slice().sort((a, b) => (b.net ?? -1e15) - (a.net ?? -1e15));
  let h = `<div class="tiles"><div class="tile"><span class="mu">Pot</span><b class="num">${chf(st.pot)}</b></div><div class="tile"><span class="mu">Dauer</span><b>${fDur(st.dur)}</b></div></div>`;
  if (st.diff !== 0) h += `<div class="banner err">⚠️ Kontrollsumme stimmt nicht: Endbeträge ${chf(st.endSum)}, Buy-ins ${chf(st.pot)} (Differenz ${sgn(st.diff)}). <u data-a="editEnds">Korrigieren</u></div>`;
  h += `<h3>Resultat</h3><div class="card tw"><table><tr><th>Spieler</th><th>Buy-in</th><th>Ende</th><th>Netto</th><th>ROI</th></tr>`;
  P.forEach(p => {
    h += `<tr><td>${esc(mName(p.id))}</td><td>${NF.format(p.buy / 100)}</td><td>${p.end == null ? '–' : NF.format(p.end / 100)}</td><td class="${cls(p.net)}"><b>${p.net == null ? '–' : sgn(p.net)}</b></td><td>${p.buy && p.net != null ? pctS(p.net / p.buy) : '–'}</td></tr>`;
  });
  h += `</table></div>`;
  const tx = settleTx(P.map(p => ({ id: p.id, net: p.net || 0 })));
  h += `<h3>Ausgleich</h3><div class="card list">`;
  h += tx.length ? tx.map(t => `<div class="li"><span class="grow">${esc(mName(t.from))} → <b>${esc(mName(t.to))}</b></span><span class="num">${chf(t.v)}</span></div>`).join('') : `<div class="li mu">Kein Ausgleich nötig.</div>`;
  h += `</div><div class="note">Gilt, wenn die Buy-ins nicht bar in eine gemeinsame Kasse bezahlt wurden.</div>`;
  const tt = nightTitles(st);
  if (tt) h += `<h3>Titel des Abends</h3><div class="card list">${tt}</div>`;
  h += `<h3>Details</h3><div class="card tw"><table><tr><th>Spieler</th><th>Rebuys</th><th>All-ins</th><th>gewonnen</th><th>CHF/h</th><th>bis Rebuy</th></tr>`;
  P.forEach(p => {
    h += `<tr><td>${esc(mName(p.id))}</td><td>${p.rebuys}</td><td>${p.allins}</td><td>${pct(p.allinWins, p.allins)}</td><td class="${cls(p.net)}">${p.net != null && p.hours > 0 ? sgn(Math.round(p.net / p.hours)) : '–'}</td><td>${p.ttr ? fDur(p.ttr) : '–'}</td></tr>`;
  });
  h += `</table></div>`;
  h += `<button class="btn block" data-a="editEnds">Endbeträge bearbeiten</button><button class="btn block" data-a="reopen">Abend wieder öffnen</button>`;
  h += logHtml(s, true);
  return h;
}

function tile(l, v) { return `<div class="tile"><span class="mu">${l}</span><b class="num">${v}</b></div>`; }

function statsHtml(g) {
  const X = groupStats(g);
  if (!X.ss.length) return `<div class="empty">Noch keine abgeschlossenen Abende.<br>Statistiken erscheinen, sobald ein Abend abgeschlossen ist.</div>`;
  let h = `<div class="tiles">${tile('Abende', X.ss.length)}${tile('Ø Dauer', fDur(X.durAvg))}${tile('Ø Spieler', (Math.round(X.plAvg * 10) / 10).toLocaleString('de-CH'))}${tile('Ø Pot', chf(X.potAvg))}</div>`;

  const mx = Math.max(1, ...X.arr.map(q => Math.abs(q.total)));
  h += `<h3>Gesamtbilanz (CHF)</h3><div class="card">` + X.arr.map(q => {
    const w = Math.abs(q.total) / mx * 50;
    return `<div class="bar"><span class="bn">${esc(mName(q.id))}</span><span class="bt"><span class="bz"></span><span class="bf ${cls(q.total)}" style="${q.total >= 0 ? 'left' : 'right'}:50%;width:${w.toFixed(1)}%"></span></span><span class="bv ${cls(q.total)}">${sgn(q.total)}</span></div>`;
  }).join('') + `</div>`;

  if (X.ss.length >= 2) h += `<h3>Verlauf kumuliert (CHF)</h3><div class="card">${lineChart(X)}</div>`;

  h += `<h3>Rangliste</h3><div class="card tw"><table><tr><th>Spieler</th><th>Abende</th><th>Bilanz</th><th>Ø/Abend</th><th>Siegquote</th><th>ROI</th><th>CHF/h</th><th>Streuung</th><th>Max +</th><th>Max −</th><th>Serie</th><th>Rebuys/Abend</th><th>All-in %</th><th>Ø bis Rebuy</th></tr>`;
  X.arr.forEach(q => {
    h += `<tr><td>${esc(mName(q.id))}</td><td>${q.nights}</td><td class="${cls(q.total)}"><b>${sgn(q.total)}</b></td><td class="${cls(q.avg)}">${sgn(Math.round(q.avg))}</td>
      <td>${pct(q.wins, q.nights)}</td><td>${q.roi == null ? '–' : pctS(q.roi)}</td><td class="${cls(q.perH)}">${q.perH == null ? '–' : sgn(Math.round(q.perH))}</td>
      <td>${q.sd == null ? '–' : NF.format(q.sd / 100)}</td><td class="pos">${q.max > 0 ? sgn(q.max) : '–'}</td><td class="neg">${q.min < 0 ? sgn(q.min) : '–'}</td>
      <td class="${q.streak ? (q.streak.sg > 0 ? 'pos' : 'neg') : ''}">${q.streak ? q.streak.n + '× ' + (q.streak.sg > 0 ? 'Plus' : 'Minus') : '–'}</td>
      <td>${(Math.round(q.rebuys / q.nights * 10) / 10).toLocaleString('de-CH')}</td><td>${pct(q.allinWins, q.allins)}${q.allins ? ` <span class="mu">(${q.allins})</span>` : ''}</td><td>${q.ttrAvg ? fDur(q.ttrAvg) : '–'}</td></tr>`;
  });
  h += `</table></div><div class="note">Siegquote = Anteil Abende im Plus. Streuung = Standardabweichung des Nettos pro Abend (CHF). Serie = aktuelle Plus- bzw. Minusserie.</div>`;

  const A = X.arr, qa = q => q.allinWins / q.allins;
  let t = '';
  t += titleRow('🦈', 'Haifisch (höchste Bilanz)', best(A.filter(q => q.total > 0), q => q.total, 1), q => sgn(q.total));
  t += titleRow('🏆', 'Meiste Abende im Plus', best(A.filter(q => q.wins > 0), q => q.wins, 1), q => q.wins + '×');
  t += titleRow('🏧', 'Bankautomat (Rebuys/Abend)', best(A.filter(q => q.rebuys > 0), q => q.rebuys / q.nights, 1), q => (Math.round(q.rebuys / q.nights * 10) / 10).toLocaleString('de-CH'));
  t += titleRow('💥', 'Kamikaze (All-ins/Abend)', best(A.filter(q => q.allins > 0), q => q.allins / q.nights, 1), q => (Math.round(q.allins / q.nights * 10) / 10).toLocaleString('de-CH'));
  const a5 = A.filter(q => q.allins >= 5);
  const lk = best(a5, qa, 1), ul = best(a5, qa, -1);
  t += titleRow('🍀', 'Glückspilz (ab 5 All-ins)', lk, q => pct(q.allinWins, q.allins));
  if (lk.length && ul.length && qa(ul[0]) < qa(lk[0])) t += titleRow('🌧️', 'Pechvogel (ab 5 All-ins)', ul, q => pct(q.allinWins, q.allins));
  t += titleRow('🎯', 'Knockout-König', best(A.filter(q => q.ko > 0), q => q.ko, 1), q => q.ko + ' KOs');
  t += titleRow('🧊', 'Mr. Konstant (ab 3 Abenden)', best(A.filter(q => q.sd != null && q.nights >= 3), q => q.sd, -1), q => '± ' + NF.format(q.sd / 100));
  if (t) h += `<h3>Titel (alle Abende)</h3><div class="card list">${t}</div>`;

  const hasDuels = Object.keys(X.beats).length > 0;
  if (hasDuels) {
    h += `<h3>Duelle (All-ins mit Gegner)</h3><div class="card tw"><table><tr><th>Spieler</th><th>Knockouts</th><th>Nemesis</th><th>Lieblingsopfer</th></tr>`;
    A.forEach(q => {
      const lostTo = A.filter(o => o.id !== q.id && ((X.beats[o.id] || {})[q.id] || 0) > 0);
      const nem = best(lostTo, o => X.beats[o.id][q.id], 1);
      const wonVs = A.filter(o => o.id !== q.id && ((X.beats[q.id] || {})[o.id] || 0) > 0);
      const vic = best(wonVs, o => X.beats[q.id][o.id], 1);
      h += `<tr><td>${esc(mName(q.id))}</td><td>${q.ko}</td><td>${nem.length ? esc(nem.map(o => mName(o.id)).join(', ')) + ` (${X.beats[nem[0].id][q.id]})` : '–'}</td><td>${vic.length ? esc(vic.map(o => mName(o.id)).join(', ')) + ` (${X.beats[q.id][vic[0].id]})` : '–'}</td></tr>`;
    });
    h += `</table></div>`;
    h += `<h3>Direktduelle: Zeile schlägt Spalte</h3><div class="card tw"><table><tr><th></th>${A.map(o => `<th>${esc(mName(o.id))}</th>`).join('')}</tr>`;
    A.forEach(r => {
      h += `<tr><td>${esc(mName(r.id))}</td>${A.map(c => r.id === c.id ? '<td class="mu">–</td>' : `<td>${(X.beats[r.id] || {})[c.id] || '·'}</td>`).join('')}</tr>`;
    });
    h += `</table></div><div class="note">Zählt gewonnene All-in-Duelle, bei denen der Gegner erfasst wurde. Knockout = Gegner hat sein All-in gegen diesen Spieler verloren.</div>`;
  } else {
    h += `<div class="note">Duell-Statistiken (Nemesis, Knockouts) erscheinen, sobald bei All-ins ein Gegner erfasst wird.</div>`;
  }
  return h;
}

function lineChart(X) {
  const ids = X.arr.map(q => q.id), n = X.series.length;
  const pts = ids.map(id => { let last = 0; const a = [0]; X.series.forEach(x => { if (x.cum[id] != null) last = x.cum[id]; a.push(last); }); return a; });
  const all = pts.flat();
  let lo = Math.min(0, ...all), hi = Math.max(0, ...all);
  if (hi === lo) hi = lo + 100;
  const W = 340, H = 190, L = 40, R = 8, T = 10, B = 20;
  const xp = i => L + i / n * (W - L - R), yp = v => T + (hi - v) / (hi - lo) * (H - T - B);
  let svg = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Kumulierter Verlauf">`;
  svg += `<line x1="${L}" x2="${W - R}" y1="${yp(0).toFixed(1)}" y2="${yp(0).toFixed(1)}" class="ax"/>`;
  const lbl = v => Math.round(v / 100).toLocaleString('de-CH');
  [hi, lo].forEach(v => { if (v !== 0) svg += `<text x="${L - 4}" y="${(yp(v) + 4).toFixed(1)}" text-anchor="end" class="axt">${lbl(v)}</text>`; });
  svg += `<text x="${L - 4}" y="${(yp(0) + 4).toFixed(1)}" text-anchor="end" class="axt">0</text>`;
  svg += `<text x="${L}" y="${H - 4}" class="axt">Start</text><text x="${W - R}" y="${H - 4}" text-anchor="end" class="axt">Abend ${n}</text>`;
  pts.forEach((a, k) => { svg += `<polyline fill="none" stroke="${COL[k % COL.length]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${a.map((v, i) => xp(i).toFixed(1) + ',' + yp(v).toFixed(1)).join(' ')}"/>`; });
  svg += `</svg>`;
  return svg + `<div class="lgd">${ids.map((id, k) => `<span><i style="background:${COL[k % COL.length]}"></i>${esc(mName(id))}</span>`).join('')}</div>`;
}

function updateSettleSum() {
  const box = document.querySelector('[data-sum]'); if (!box) return;
  const s = S(cur().id); if (!s) return;
  const st = sessStats(s);
  let sum = 0, bad = false, empty = 0;
  document.querySelectorAll('.endInp').forEach(i => { const v = parseAmt(i.value); if (v == null) empty++; else if (isNaN(v) || v < 0) bad = true; else sum += v; });
  const diff = sum - st.pot;
  box.innerHTML = `<div class="row"><span class="grow">Summe Buy-ins</span><b class="num">${chf(st.pot)}</b></div>
    <div class="row"><span class="grow">Summe Endbeträge</span><b class="num">${chf(sum)}</b></div>
    <div class="row"><span class="grow">Differenz</span><b class="num ${diff === 0 ? 'pos' : 'neg'}">${diff === 0 ? '✓ stimmt' : sgn(diff)}</b></div>
    ${bad ? '<div class="neg">Ungültige Eingabe.</div>' : ''}${empty ? `<div class="mu">${empty} Feld${empty > 1 ? 'er' : ''} leer.</div>` : ''}`;
}

function backupDue() {
  if (!D.sessions.length) return false;
  return !META.lastBackup || Date.now() - META.lastBackup > BACKUP_DAYS * 86400000;
}
async function shareOrDownload(content, name, type) {
  const blob = new Blob([content], { type });
  try {
    const file = new File([blob], name, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  return true;
}

    const d = j.data || j;
    if (!Array.isArray(d.members) || !Array.isArray(d.groups) || !Array.isArray(d.sessions)) throw new Error('Keine gültige Pokerrunde-Sicherung.');
    if (!confirm(`Backup mit ${d.members.length} Mitgliedern, ${d.groups.length} Gruppen und ${d.sessions.length} Abenden importieren? Die aktuellen Daten werden überschrieben.`)) return;
    D = { members: d.members, groups: d.groups, sessions: d.sessions };
    await save(); setTab('data'); toast('Backup importiert');
  } catch (e) { alert('Import fehlgeschlagen: ' + e.message); }
