<body>
<header id="hdr"><div class="hrow">
 <button id="backBtn" class="hbtn" data-a="back" aria-label="Zurück">‹</button>
 <h1 id="title">Pokerrunde</h1>
 <button id="menuBtn" class="hbtn" data-a="hmenu" aria-label="Menü">⋯</button>
</div></header>
<main id="app"></main>
<footer id="ftr"><nav>
 <button class="tab" data-a="tab" data-t="groups"><span>♣</span>Gruppen</button>
 <button class="tab" data-a="tab" data-t="members"><span>👥</span>Mitglieder</button>
 <button class="tab" data-a="tab" data-t="data"><span>💾</span>Daten</button>
</nav></footer>

<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
'use strict';
const APP_VERSION = '1.11';
const BACKUP_DAYS = 365;
const COL = ['#2563eb','#dc2626','#16a34a','#d97706','#7c3aed','#0891b2','#db2777','#65a30d','#475569','#ea580c'];

/* ---------- Speicher (IndexedDB) ---------- */
const Storage = {
  _db: null,
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('pokerrunde', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this._db = r.result; res(this._db); };
      r.onerror = () => rej(r.error);
    });
  },
  async get(k) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const q = db.transaction('kv').objectStore('kv').get(k);
      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
    });
  },
  async set(k, v) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(v, k);
      tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
    });
  }
};

let D = { members: [], groups: [], sessions: [] };
let META = { lastBackup: null };
const save = () => Storage.set('data', D).catch(e => toast('Speichern fehlgeschlagen: ' + e));
const saveMeta = () => Storage.set('meta', META).catch(() => {});

/* ---------- Hilfsfunktionen ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const NF = new Intl.NumberFormat('de-CH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const chf = c => 'CHF ' + NF.format((c || 0) / 100);
const sgn = c => (c > 0 ? '+' : c < 0 ? '−' : '') + NF.format(Math.abs(c || 0) / 100);
const cls = c => c > 0 ? 'pos' : c < 0 ? 'neg' : '';
const parseAmt = s => {
  if (s == null) return null;
  s = String(s).trim().replace(/[’'\s]/g, '').replace(',', '.');
  if (s === '') return null;
  const x = Number(s);
  return isFinite(x) ? Math.round(x * 100) : NaN;
};
const amtIn = c => c == null ? '' : (c / 100).toFixed(2);
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const dtLocal = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fDate = t => new Date(t).toLocaleDateString('de-CH', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' });
const fTime = t => new Date(t).toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
const fDur = ms => { const m = Math.max(0, Math.round(ms / 60000)), h = Math.floor(m / 60); return h ? `${h} h ${pad(m % 60)} min` : `${m} min`; };
const pctS = r => (r < 0 ? '−' : '') + Math.abs(Math.round(r * 100)) + ' %';
const pct = (a, b) => b ? Math.round(a / b * 100) + ' %' : '–';
const byName = (a, b) => a.name.localeCompare(b.name, 'de');
const mName = id => (D.members.find(m => m.id === id) || { name: '?' }).name;
const isArch = id => !!(D.members.find(m => m.id === id) || {}).archived;
const G = id => D.groups.find(g => g.id === id);
const S = id => D.sessions.find(s => s.id === id);
const sortIds = ids => ids.slice().sort((a, b) => mName(a).localeCompare(mName(b), 'de'));

/* ---------- Berechnungen ---------- */
function pausedMs(s, a, b) {
  if (!s.pauses || b <= a) return 0;
  return s.pauses.reduce((sum, p) => sum + Math.max(0, Math.min(b, p.to || Date.now()) - Math.max(a, p.from)), 0);
}
const isPaused = s => !!(s.pauses && s.pauses.some(p => !p.to));

function sessStats(s) {
  const end = s.end || Date.now();
  const map = {};
  s.players.forEach(p => map[p.memberId] = { id: p.memberId, buys: [], buy: 0, rebuys: 0, allins: 0, allinWins: 0, end: p.end ?? null, left: p.left || null, joined: p.joined || null, net: null, hours: 0, ttr: null });
  s.events.slice().sort((a, b) => a.t - b.t).forEach(e => {
    const p = map[e.memberId]; if (!p) return;
    if (e.type === 'buyin') { p.buys.push(e.t); p.buy += e.amount; }
    else if (e.type === 'allin') { p.allins++; if (e.won) p.allinWins++; }
  });
  const arr = Object.values(map);
  arr.forEach(p => {
    p.rebuys = Math.max(0, p.buys.length - 1);
    if (p.end != null) p.net = p.end - p.buy;
    const pe = p.left && p.left > s.start && p.left < end ? p.left : end;
    let st = p.buys.length ? p.buys[0] : s.start;
    if (st < s.start || st > pe) st = s.start;
    p.hours = Math.max(0, (pe - st - pausedMs(s, st, pe)) / 3600000);
    if (p.buys.length > 1 && p.buys[1] - p.buys[0] >= 60000) p.ttr = Math.max(0, p.buys[1] - p.buys[0] - pausedMs(s, p.buys[0], p.buys[1]));
    if (s.noTime) { p.hours = 0; p.ttr = null; }
  });
  const pot = arr.reduce((a, p) => a + p.buy, 0);
  const endSum = arr.reduce((a, p) => a + (p.end || 0), 0);
  return { players: arr, map, pot, endSum, diff: endSum - pot, dur: s.noTime ? null : Math.max(0, end - s.start - pausedMs(s, s.start, end)), pause: s.noTime ? 0 : pausedMs(s, s.start, end) };
}

function settleTx(players) {
  const cr = players.filter(p => p.net > 0).map(p => ({ id: p.id, v: p.net })).sort((a, b) => b.v - a.v);
  const db = players.filter(p => p.net < 0).map(p => ({ id: p.id, v: -p.net })).sort((a, b) => b.v - a.v);
  const tx = []; let i = 0, j = 0;
  while (i < db.length && j < cr.length) {
    const x = Math.min(db[i].v, cr[j].v);
    if (x > 0) tx.push({ from: db[i].id, to: cr[j].id, v: x });
    db[i].v -= x; cr[j].v -= x;
    if (db[i].v === 0) i++;
    if (cr[j].v === 0) j++;
  }
  return tx;
}

function best(arr, f, dir) {
  if (!arr.length) return [];
  const vals = arr.map(f), m = dir > 0 ? Math.max(...vals) : Math.min(...vals);
  return arr.filter((p, i) => vals[i] === m);
}
function titleData(icon, name, winners, val) {
  return winners.length ? { icon, name, who: winners.map(p => mName(p.id)).join(', '), val: val(winners[0]) } : null;
}
function titleRow(icon, name, winners, val) {
  if (!winners.length) return '';
  return `<div class="li"><span class="ico">${icon}</span><span class="grow"><b>${esc(name)}</b><div class="mu">${esc(winners.map(p => mName(p.id)).join(', '))}</div></span><span class="num">${val(winners[0])}</span></div>`;
}

function nightTitlesData(st) {
  const P = st.players.filter(p => p.net != null);
  const q = p => p.allinWins / p.allins;
  const ai2 = P.filter(p => p.allins >= 2);
  const lucky = best(ai2.filter(p => q(p) > 0.5), q, 1), unlucky = best(ai2.filter(p => q(p) < 0.5), q, -1);
  const r = [
    titleData('🦈', 'Haifisch', best(P.filter(p => p.net > 0), p => p.net, 1), p => sgn(p.net)),
    titleData('👑', 'Comeback-König', best(P.filter(p => p.net > 0 && p.rebuys > 0), p => p.net, 1), p => `${p.rebuys} Rebuy${p.rebuys > 1 ? 's' : ''}`),
    titleData('🏧', 'Bankautomat', best(P.filter(p => p.rebuys > 0), p => p.rebuys, 1), p => `${p.rebuys} Rebuy${p.rebuys > 1 ? 's' : ''}`),
    titleData('💥', 'Kamikaze', best(P.filter(p => p.allins > 0), p => p.allins, 1), p => `${p.allins} All-in${p.allins > 1 ? 's' : ''}`),
    titleData('🍀', 'Glückspilz', lucky, p => pct(p.allinWins, p.allins))
  ];
  if (unlucky.length) r.push(titleData('🌧️', 'Pechvogel', unlucky, p => pct(p.allinWins, p.allins)));
  return r.filter(Boolean);
}
function nightTitles(st) {
  return nightTitlesData(st).map(x => `<div class="li"><span class="ico">${x.icon}</span><span class="grow"><b>${esc(x.name)}</b><div class="mu">${esc(x.who)}</div></span><span class="num">${x.val}</span></div>`).join('');
}

function groupStats(g) {
  const ss = D.sessions.filter(s => s.groupId === g.id && s.status === 'closed').sort((a, b) => a.start - b.start);
  const P = {}, beats = {}, cum = {}, series = [];
  const get = id => P[id] || (P[id] = { id, nights: 0, nets: [], total: 0, buy: 0, rebuys: 0, allins: 0, allinWins: 0, hours: 0, timedNet: 0, ttr: [], ko: 0, wins: 0 });
  let durSum = 0, durN = 0, plSum = 0, potSum = 0;
  ss.forEach(s => {
    const st = sessStats(s);
    if (st.dur != null) { durSum += st.dur; durN++; }
    plSum += st.players.length; potSum += st.pot;
    st.players.forEach(p => {
      const q = get(p.id), net = p.net ?? 0;
      q.nights++; q.nets.push(net); q.total += net; q.buy += p.buy; q.rebuys += p.rebuys;
      q.allins += p.allins; q.allinWins += p.allinWins; q.hours += p.hours;
      if (p.ttr != null) q.ttr.push(p.ttr);
      if (net > 0) q.wins++;
      if (!s.noTime) q.timedNet += net;
      cum[p.id] = (cum[p.id] || 0) + net;
    });
    s.events.forEach(e => {
      if (e.type !== 'allin' || !e.opp || !st.map[e.opp]) return;
      const w = e.won ? e.memberId : e.opp, l = e.won ? e.opp : e.memberId;
      (beats[w] || (beats[w] = {}))[l] = ((beats[w] || {})[l] || 0) + 1;
      if (!e.won && e.bust !== false) get(e.opp).ko++;
      if (e.won && e.oppBust) get(e.memberId).ko++;
    });
    series.push({ t: s.start, cum: { ...cum } });
  });
  const arr = Object.values(P);
  arr.forEach(q => {
    q.avg = q.total / q.nights;
    q.sd = q.nights > 1 ? Math.sqrt(q.nets.reduce((a, x) => a + (x - q.avg) ** 2, 0) / (q.nights - 1)) : null;
    q.max = Math.max(...q.nets); q.min = Math.min(...q.nets);
    let k = 0, sg = 0;
    for (let i = q.nets.length - 1; i >= 0; i--) {
      const sn = Math.sign(q.nets[i]);
      if (sn === 0) break;
      if (!sg) sg = sn;
      if (sn !== sg) break;
      k++;
    }
    q.streak = k ? { n: k, sg } : null;
    q.ttrAvg = q.ttr.length ? q.ttr.reduce((a, b) => a + b, 0) / q.ttr.length : null;
    q.perH = q.hours > 0 ? q.timedNet / q.hours : null;
    q.roi = q.buy ? q.total / q.buy : null;
  });
  arr.sort((a, b) => b.total - a.total);
  return { ss, arr, beats, series, durAvg: durN ? durSum / durN : null, plAvg: ss.length ? plSum / ss.length : 0, potAvg: ss.length ? potSum / ss.length : 0 };
}

/* ---------- Navigation ---------- */
let stack = [{ v: 'groups' }];
let M = {};
const cur = () => stack[stack.length - 1];
const hideToast = () => { const t = document.getElementById('toast'); if (t) t.classList.add('hidden'); };
function go(v) { hideToast(); stack.push(v); render(); window.scrollTo(0, 0); }
function back() { if (stack.length > 1) { hideToast(); stack.pop(); render(); } }
function setTab(t) { hideToast(); stack = [{ v: t }]; render(); window.scrollTo(0, 0); }

function render() {
  const c = cur();
  let r;
  try { r = VIEWS[c.v](c); }
  catch (e) { console.error(e); r = { title: 'Fehler', html: `<div class="banner err">${esc(e.message)}</div>` }; }
  if (!r) { if (stack.length > 1) { stack.pop(); return render(); } r = { title: '', html: '' }; }
  $('title').textContent = r.title;
  $('backBtn').style.visibility = stack.length > 1 ? 'visible' : 'hidden';
  $('menuBtn').style.visibility = r.menu ? 'visible' : 'hidden';
  $('app').innerHTML = r.html;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === stack[0].v));
  measure();
}

function measure() {
  const r = document.documentElement.style;
  r.setProperty('--hh', $('hdr').offsetHeight + 'px');
  r.setProperty('--fh', $('ftr').offsetHeight + 'px');
}

/* ---------- Modal & Toast ---------- */
function modal(html) { $('sheet').innerHTML = html; $('modal').classList.remove('hidden'); $('sheet').scrollTop = 0; }
function closeModal() { $('modal').classList.add('hidden'); $('sheet').innerHTML = ''; }
let toastTimer = null;
function toast(msg, label, fn) {
  const t = $('toast');
  t.innerHTML = `<span>${esc(msg)}</span>` + (label ? `<button type="button">${esc(label)}</button>` : '');
  t.classList.remove('hidden');
  if (label) t.querySelector('button').onclick = () => { t.classList.add('hidden'); fn(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), label ? 6000 : 2500);
}
function askText(title, value, onSave, extra) {
  M.onText = onSave;
  modal(`<h2>${esc(title)}</h2><label>Name<input type="text" data-f="txt" value="${esc(value)}" autocomplete="off"></label>${extra || ''}
  <div class="mbtns"><button class="btn" data-a="modalClose">Abbrechen</button><button class="btn pri" data-a="textSave">Speichern</button></div>`);
  if (!value) focusField('[data-f=txt]');
}
function focusField(sel) { const i = $('sheet').querySelector(sel); if (i) { i.focus(); try { i.setSelectionRange(i.value.length, i.value.length); } catch (e) {} } }
function chipsHtml(ids, selected, action) {

function logHtml(s, collapsed) {
  const ev = s.events.concat(
    s.players.filter(p => p.joined).map(p => ({ t: p.joined, type: 'join', memberId: p.memberId })),
    s.players.filter(p => p.left).map(p => ({ t: p.left, type: 'leave', memberId: p.memberId, amount: p.end })),
    s.noTime ? [] : (s.pauses || []).map(p => ({ t: p.from, type: 'pause', to: p.to }))
  ).sort((a, b) => b.t - a.t);
  if (!ev.length) return '';
  const tm = x => s.noTime ? '' : fTime(x);
  let h = `<div class="card list">`;
  ev.forEach(e => {
    if (e.type === 'pause') {
      h += `<div class="li"><span class="mu num">${tm(e.t)}</span><span class="grow">⏸ Pause ${e.to ? `bis ${fTime(e.to)} (${fDur(e.to - e.t)})` : 'läuft'}</span></div>`;

      h += `<div class="li"><span class="mu num">${tm(e.t)}</span><span class="grow"><b>${esc(mName(e.memberId))}</b> · ${e.type === 'join' ? 'stösst dazu' : 'geht, ausbezahlt ' + chf(e.amount)}</span></div>`;

function lineChart(X) {

  const all = pts.flat();

  const W = 340, H = 190, L = 40, R = 8, T = 10, B = 20;

  let svg = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Kumulierter Verlauf">`;
  svg += `<line x1="${L}" x2="${W - R}" y1="${yp(0).toFixed(1)}" y2="${yp(0).toFixed(1)}" class="ax"/>`;

function pdfStr(s) {
  let o = '';
  for (const ch of String(s ?? '')) {

    const c = ch.codePointAt(0);

function pdfW(s, size) {

}
const C_TX = [0.08, 0.13, 0.1], C_MU = [0.36, 0.42, 0.39], C_POS = [0.08, 0.5, 0.24], C_NEG = [0.73, 0.11, 0.11];
class PdfDoc {

      const pid = n++, cid = n++;

function sessionPdf(s) {
  const g = G(s.groupId), st = sessStats(s);
  const P = st.players.slice().sort((a, b) => (b.net ?? -1e15) - (a.net ?? -1e15));
  const d = new PdfDoc();
  const nc = v => v > 0 ? C_POS : v < 0 ? C_NEG : C_TX;
  d.cur.push('0.078 0.325 0.176 rg 0 771.89 595.28 70 re f');
  d.text(50, 810, 'Pokerabend ' + new Date(s.start).toLocaleDateString('de-CH', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' }), { size: 18, bold: true, color: [1, 1, 1] });
  d.text(50, 790, g ? g.name : '', { size: 11, color: [0.85, 0.93, 0.88] });
  d.y = 745;
  const info = [['Pot', chf(st.pot)], ['Spieler', String(st.players.length)]];
  if (s.noTime) info.push(['Zeit', 'nachgetragen, ohne Uhrzeiten']);
  else {
    info.push(['Zeit', `${fTime(s.start)} – ${s.end ? fTime(s.end) : 'läuft'}`], ['Dauer', fDur(st.dur) + (st.pause >= 60000 ? ' (ohne Pausen)' : '')]);
    if (st.pause >= 60000) info.push(['Pausen', fDur(st.pause)]);
  }
  info.forEach(([k, v]) => { d.text(50, d.y, k, { size: 10, color: C_MU }); d.text(130, d.y, v, { size: 10, bold: true }); d.y -= 15; });
  if (st.diff !== 0) { d.y -= 4; d.text(50, d.y, `Achtung: Kontrollsumme stimmt nicht. Endbeträge ${chf(st.endSum)}, Buy-ins ${chf(st.pot)}, Differenz ${sgn(st.diff)}.`, { size: 9.5, color: C_NEG }); d.y -= 15; }
  d.heading('Resultat');
  d.table([{ h: 'Spieler', w: 150 }, { h: 'Buy-ins', w: 55 }, { h: 'Buy-in CHF', w: 75 }, { h: 'Ende CHF', w: 75 }, { h: 'Netto CHF', w: 80 }, { h: 'ROI', w: 60 }],
    P.map(p => [mName(p.id), String(p.buys.length), NF.format(p.buy / 100), p.end == null ? '-' : NF.format(p.end / 100),
      { t: p.net == null ? '-' : sgn(p.net), bold: true, color: nc(p.net) }, p.buy && p.net != null ? pctS(p.net / p.buy) : '-']));
  d.heading('Ausgleich');
  const tx = settleTx(P.map(p => ({ id: p.id, net: p.net || 0 })));
  if (!tx.length) { d.text(50, d.y, 'Kein Ausgleich nötig.', { size: 10 }); d.y -= 16; }
  tx.forEach(x => { d.need(16); d.text(54, d.y, `${mName(x.from)} → ${mName(x.to)}`, { size: 10 }); d.text(400, d.y, chf(x.v), { size: 10, bold: true, align: 'right' }); d.y -= 16; });
  d.text(50, d.y, 'Gilt, wenn die Buy-ins nicht bar in eine gemeinsame Kasse bezahlt wurden.', { size: 8, color: C_MU }); d.y -= 6;
  const tt = nightTitlesData(st);
  if (tt.length) {
    d.heading('Titel des Abends');
    tt.forEach(x => { d.need(16); d.text(54, d.y, x.name, { size: 10, bold: true }); d.text(180, d.y, x.who, { size: 10 }); d.text(545, d.y, x.val, { size: 10, align: 'right' }); d.y -= 16; });
  }
  d.heading('Details');
  const cols = [{ h: 'Spieler', w: 130 }, { h: 'Rebuys', w: 55 }, { h: 'All-ins', w: 55 }, { h: 'gewonnen', w: 65 }];
  if (!s.noTime) cols.push({ h: 'am Tisch', w: 65 }, { h: 'CHF/h', w: 60 }, { h: 'bis Rebuy', w: 65 });
  d.table(cols, P.map(p => {
    const r = [mName(p.id), String(p.rebuys), String(p.allins), pct(p.allinWins, p.allins)];
    if (!s.noTime) r.push(p.hours > 0 ? fDur(p.hours * 3600000) : '-', { t: p.net != null && p.hours > 0 ? sgn(Math.round(p.net / p.hours)) : '-', color: nc(p.net) }, p.ttr ? fDur(p.ttr) : '-');
    return r;
  }));
  const moves = s.players.filter(p => (p.joined || p.left) && !s.noTime);
  if (moves.length) {
    d.heading('Kommen und Gehen');
    moves.forEach(p => { d.need(16); d.text(54, d.y, mName(p.memberId), { size: 10 }); d.text(180, d.y, [p.joined ? 'ab ' + fTime(p.joined) : '', p.left ? 'bis ' + fTime(p.left) : ''].filter(Boolean).join(', '), { size: 10 }); d.y -= 16; });
  }
  if (g) groupPdfSection(d, g);
  return d.build(`Pokerrunde · erstellt ${new Date().toLocaleDateString('de-CH')} ${fTime(Date.now())}`);
}

function addBuy(s, memberId, amount, t) {
  const e = { id: uid(), t: t || Date.now(), type: 'buyin', memberId, amount };
  s.events.push(e);
  return e;
}
function backupDue() {
  if (!D.sessions.length) return false;
  return !META.lastBackup || Date.now() - META.lastBackup > BACKUP_DAYS * 86400000;
}
async function shareOrDownload(content, name, type) {
  const blob = new Blob([content], { type });
  try {
    const file = new File([blob], name, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  return true;
}

    if (sum !== st.pot && !confirm(`Kontrollsumme stimmt nicht (Differenz ${sgn(sum - st.pot)}). Trotzdem speichern?`)) return;
    s.players.forEach(p => { p.end = vals[p.memberId] || 0; });
    if (s.status !== 'closed') { s.status = 'closed'; s.end = s.noTime ? s.start : Date.now(); (s.pauses || []).forEach(p => { if (!p.to) p.to = s.end; }); }
    save(); stack.pop(); render(); window.scrollTo(0, 0);
  },
  reopen() {
    const s = S(cur().id);
    if (!confirm('Abend wieder öffnen? Die Endbeträge bleiben als Vorschlag erhalten.')) return;
    if (s.end && !s.noTime && Date.now() - s.end >= 60000) (s.pauses || (s.pauses = [])).push({ from: s.end, to: Date.now() });
    s.status = 'open'; s.end = null; save(); closeModal(); render();
  },
  editTimes() {
    const s = S(cur().id);
    if (s.noTime) {
      modal(`<h2>Datum ändern</h2><label>Datum<input type="date" data-f="tDate" value="${dtLocal(s.start).slice(0, 10)}"></label>
        <div class="mbtns"><button class="btn" data-a="modalClose">Abbrechen</button><button class="btn pri" data-a="timesSave">Speichern</button></div>`);
      return;
    }
    modal(`<h2>Zeiten ändern</h2><label>Start<input type="datetime-local" data-f="tStart" value="${dtLocal(s.start)}"></label>
      ${s.end ? `<label>Ende<input type="datetime-local" data-f="tEnd" value="${dtLocal(s.end)}"></label>` : ''}
      <div class="mu" style="margin:4px 2px">Was passiert mit den Einträgen?${ib('times')}</div>
      <div class="mbtns"><button class="btn" data-a="modalClose">Abbrechen</button><button class="btn pri" data-a="timesSave">Speichern</button></div>`);
  },
  timesSave() {
    const s = S(cur().id);
    const all = f => { s.events.forEach(e => e.t = f(e.t)); s.players.forEach(p => { if (p.joined) p.joined = f(p.joined); if (p.left) p.left = f(p.left); }); (s.pauses || []).forEach(p => { p.from = f(p.from); if (p.to) p.to = f(p.to); }); };
    if (s.noTime) {
      const dv = document.querySelector('[data-f=tDate]').value;
      const st = dv ? new Date(dv + 'T20:00').getTime() : NaN;
      if (isNaN(st)) return toast('Ungültiges Datum.');
      const d = st - s.start; all(x => x + d);
      s.start = st; if (s.end) s.end = st;
      save(); closeModal(); render(); return;
    }
    const st = new Date(document.querySelector('[data-f=tStart]').value).getTime();
    const ei = document.querySelector('[data-f=tEnd]');
    const en = ei ? new Date(ei.value).getTime() : null;
    if (isNaN(st) || (ei && isNaN(en))) return toast('Ungültige Zeit.');
    if (en != null && en <= st) return toast('Ende muss nach dem Start liegen.');
    if (en == null && st > Date.now()) return toast('Start darf nicht in der Zukunft liegen.');
    const os = s.start, oe = s.end || Date.now(), ne = en != null ? en : Date.now();
    const ts = s.events.map(e => e.t).concat(s.players.map(p => p.joined).filter(Boolean), s.players.map(p => p.left).filter(Boolean), (s.pauses || []).flatMap(p => [p.from, p.to].filter(Boolean)));
    if (ts.every(x => x >= st && x <= ne)) {
      all(x => x === os ? st : x);
    } else {
      all(x => Math.round(st + (Math.min(Math.max(x, os), oe) - os) / Math.max(1, oe - os) * (ne - st)));
    }
    s.start = st; if (en != null) s.end = en;
    save(); closeModal(); render();
  },
  delSession() {
    const s = S(cur().id);
    if (!confirm(`Abend vom ${fDate(s.start)} endgültig löschen?`)) return;
    D.sessions = D.sessions.filter(x => x.id !== s.id); save(); closeModal(); back();
  },

  newMember() {
    askText('Neues Mitglied', '', name => { D.members.push({ id: uid(), name }); save(); render(); });
  },
  memberMenu(el) {
    const m = D.members.find(x => x.id === el.dataset.id);
    const used = D.sessions.some(s => s.players.some(p => p.memberId === m.id) || s.events.some(e => e.memberId === m.id || e.opp === m.id));
    M = { mid: m.id };
    const groups = D.groups.slice().sort(byName);
    askText('Mitglied bearbeiten', m.name, name => { m.name = name; save(); render(); },
      `${groups.length ? `<div class="lbl">Gruppen (antippen zum Zuordnen)</div><div class="chips">${groups.map(g => `<button class="chip ${g.memberIds.includes(m.id) ? 'on' : ''}" data-a="mGroup" data-id="${g.id}">${esc(g.name)}</button>`).join('')}</div>` : ''}
       <button class="btn block" data-a="mArchive">${m.archived ? 'Reaktivieren' : 'Archivieren'}</button>
       ${used ? `<div class="mu" style="margin:8px 2px">Löschen nicht möglich${ib('noDelete')}</div>` : '<button class="btn danger block" data-a="mDelete">Löschen</button>'}`);
  },
  mGroup(el) {
    const g = G(el.dataset.id), id = M.mid;
    if (g.memberIds.includes(id)) g.memberIds = g.memberIds.filter(x => x !== id); else g.memberIds.push(id);
    el.classList.toggle('on', g.memberIds.includes(id)); save();
  },
  mArchive() { const m = D.members.find(x => x.id === M.mid); m.archived = !m.archived; save(); closeModal(); render(); },
  mDelete() {
    const m = D.members.find(x => x.id === M.mid);
    if (!confirm(`${m.name} löschen?`)) return;
    D.members = D.members.filter(x => x.id !== m.id);
    D.groups.forEach(g => g.memberIds = g.memberIds.filter(x => x !== m.id));
    save(); closeModal(); render();
  },

  help(el) {
    const k = el.dataset.k, host = el.closest('[data-host]') || el.parentElement;
    const nx = host.nextElementSibling;
    if (nx && nx.classList.contains('ibox') && nx.dataset.k === k) { nx.remove(); return; }
    const box = document.createElement('div');
    box.className = 'ibox'; box.dataset.k = k; box.textContent = HELP[k];
    host.insertAdjacentElement('afterend', box);
  },
  titleInfo(el) {
    const k = el.dataset.k;
    modal(`<h2>${k === 'night' ? 'Titel des Abends' : 'Titel über alle Abende'}</h2><div class="card list">` +
      TITLE_INFO[k].map(([i, n, d]) => `<div class="li"><span class="ico">${i}</span><span class="grow"><b>${n}</b><div class="mu">${d}</div></span></div>`).join('') +
      `</div><div class="mu" style="margin:4px 2px">Gleichstand${ib('ties')}</div><button class="btn block" data-a="modalClose">Schliessen</button>`);
  },
  exportPdf() {
    const s = S(cur().id), g = G(s.groupId);
    closeModal();
    const d = new Date(s.start);
    const name = `Pokerabend-${(g ? g.name : '').replace(/[^\wäöüÄÖÜ-]+/g, '_')}-${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.pdf`;
    try { shareOrDownload(sessionPdf(s), name, 'application/pdf'); }
    catch (e) { console.error(e); alert('PDF-Export fehlgeschlagen: ' + e.message); }
  },
  async exportJson() {
    const txt = JSON.stringify({ app: 'pokerrunde', format: 1, exported: new Date().toISOString(), data: D });
    const ok = await shareOrDownload(txt, `pokerrunde-backup-${today()}.json`, 'application/json');
    if (ok) { META.lastBackup = Date.now(); saveMeta(); render(); toast('Backup erstellt'); }
  },
  importJson() { $('importFile').value = ''; $('importFile').click(); }
};

$('importFile').addEventListener('change', async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    const d = j.data || j;
    if (!Array.isArray(d.members) || !Array.isArray(d.groups) || !Array.isArray(d.sessions)) throw new Error('Keine gültige Pokerrunde-Sicherung.');
    if (!confirm(`Backup mit ${d.members.length} Mitgliedern, ${d.groups.length} Gruppen und ${d.sessions.length} Abenden importieren? Die aktuellen Daten werden überschrieben.`)) return;
    D = { members: d.members, groups: d.groups, sessions: d.sessions };
    await save(); setTab('data'); toast('Backup importiert');
  } catch (e) { alert('Import fehlgeschlagen: ' + e.message); }
});

document.addEventListener('click', ev => {
  if (ev.target === $('modal')) return closeModal();
  const el = ev.target.closest('[data-a]'); if (!el) return;
  const fn = A[el.dataset.a]; if (fn) fn(el);
});
document.addEventListener('input', ev => { if (ev.target.classList.contains('endInp')) updateSettleSum(); });

setInterval(() => {
  const c = cur(); if (c.v !== 'session') return;
  const s = S(c.id); if (!s || s.status !== 'open') return;
  const d = document.querySelector('[data-dur]'); if (d) d.textContent = fDur(sessStats(s).dur);
}, 30000);

window.addEventListener('resize', measure);
window.addEventListener('orientationchange', () => setTimeout(measure, 300));
window.addEventListener('pageshow', measure);
document.addEventListener('visibilitychange', () => { if (!document.hidden) measure(); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', measure);
[100, 400, 1000, 2500].forEach(ms => setTimeout(measure, ms));
if (window.ResizeObserver) { const ro = new ResizeObserver(measure); ro.observe($('hdr')); ro.observe($('ftr')); }

(async function init() {
  try {
    const d = await Storage.get('data'); if (d) D = d;
    const m = await Storage.get('meta'); if (m) META = m;
  } catch (e) { toast('Speicher nicht verfügbar: ' + e); }
  render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
